<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="calc">
        <div class="box">
            <div class="display">
                <div class="converter" id="binario">B<input type="text" placeholder="binario"></div>
                <div class="converter" id="decimal">D<input type="text" placeholder="decimal"></div>
                <div class="converter" id="octal">O<input type="text" placeholder="octal"></div>
                <div class="converter" id="hexadecimal">H<input type="text" placeholder="hexadecimal"></div>
            </div>

            <div class="buttons">

                <button class="botao">7</button>
                <button class="botao">8</button>
                <button class="botao">9</button>


                <button class="botao">4</button>
                <button class="botao">5</button>
                <button class="botao">6</button>


                <button class="botao">1</button>
                <button class="botao">2</button>
                <button class="botao">3</button>


                <button class="inv"></button>
                <button class="botao">0</button>
                <button class="botao" id="del">←</button>
            </div>
        </div>
    </div>
    <script src="/jquery-4.0.0.min.js"></script>
    <script src="code2.js"></script>
</body>

</html>
